[browser]
gatherUsageStats = false

[theme]
base = "light"
font = "sans-serif"
showSidebarBorder = true
chartCategoricalColors = [
  "#2563EB",
  "#0F766E",
  "#D97706",
  "#DC2626",
  "#7C3AED",
  "#64748B",
]

[theme.light]
primaryColor = "#2563EB"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
borderColor = "#D9DEE7"
dataframeHeaderBackgroundColor = "#EEF1F5"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"

[theme.light.sidebar]
primaryColor = "#60A5FA"
backgroundColor = "#172033"
secondaryBackgroundColor = "#202B3D"
textColor = "#F8FAFC"
borderColor = "#334155"

[theme.dark]
primaryColor = "#60A5FA"
backgroundColor = "#0B1120"
secondaryBackgroundColor = "#131C2E"
textColor = "#E8EDF5"
borderColor = "#2A3850"
dataframeHeaderBackgroundColor = "#192438"
baseRadius = "0.6rem"
buttonRadius = "0.6rem"

[theme.dark.sidebar]
primaryColor = "#93C5FD"
backgroundColor = "#080D18"
secondaryBackgroundColor = "#111A2B"
textColor = "#F1F5F9"
borderColor = "#25334A"
