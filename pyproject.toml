[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-quality-monitor"
version = "0.1.0"
description = "Deterministic quality monitoring for synthetic expense data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "bandit[toml]",
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.bandit]
exclude_dirs = ["tests"]
